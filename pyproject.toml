[project]
name = "drone-audio-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "m1chelangelo11", email = "1michalaniol1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.5",
    "joblib>=1.5.3",
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "scikit-learn>=1.9.0",
    "sounddevice>=0.5.5",
    "torch>=2.13.0",
    "torchcodec>=0.15.0",
    "tqdm>=4.70.0",
]

[project.scripts]
drone-audio-detection = "drone_audio_detection:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package=false
